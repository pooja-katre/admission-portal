<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - Admission Portal</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d1b2a; /* dark blue background */
      color: #e0e0e0;      /* light grey text for readability */
    }

    h1, h2, h3 {
      color: #ffffff; /* headings white */
    }

    p {
      color: #e0e0e0; /* instructions light grey */
    }

    label {
      color: #fff; /* form labels white */
    }

    .card {
      background: rgba(255,255,255,0.9);
      border: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .btn-primary {
      background-color: #2575fc;
      border: none;
    }
    .btn-primary:hover {
      background-color: #6a11cb;
    }

    footer {
      background: #2575fc;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html">Admission Portal</a>
      <a class="btn btn-outline-primary" href="about.html">About</a>
    </div>
  </nav>

  <!-- Contact Section -->
  <div class="container my-5">
    <h2 class="text-center mb-4">Contact Us</h2>
    <p class="text-center">Have questions? Fill out the form below or reach us at 
      <span class="text-info">admissions@college.edu</span>.
    </p>
    <div class="card p-4">
      <form>
        <div class="mb-3">
          <label class="form-label">Your Name</label>
          <input type="text" class="form-control" placeholder="Enter your name">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="Enter your email">
        </div>
        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea class="form-control" rows="4" placeholder="Write your message"></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100">Send Message</button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    &copy; 2026 College Admission Portal | Contact Us
  </footer>

</body>
</html>
