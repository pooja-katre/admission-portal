<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - Admission Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f9f9f9; font-family:'Segoe UI', sans-serif;">
  <nav class="navbar navbar-expand-lg bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html">Admission Portal</a>
      <a class="btn btn-outline-primary" href="about.html">About</a>
    </div>
  </nav>

  <div class="container my-5">
    <h1 class="text-primary mb-4">Contact Us</h1>
    <p class="lead">Have questions? Fill out the form below or reach us at <strong>admissions@college.edu</strong>.</p>
    
    <div class="card p-4 shadow-sm">
      <form>
        <div class="mb-3">
          <label class="form-label">Your Name</label>
          <input type="text" class="form-control" placeholder="Enter your name">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="Enter your email">
        </div>
        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea class="form-control" rows="4" placeholder="Write your message"></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100">Send Message</button>
      </form>
    </div>
  </div>

  <footer class="bg-primary text-white text-center p-3 mt-5">
    &copy; 2026 College Admission Portal | Contact Us
  </footer>
</body>
</html>
