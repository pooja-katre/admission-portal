<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - Admission Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #1e3c72, #2a5298); /* Blue gradient */
      min-height: 100vh;
      color: white;
    }
    .overlay {
      background: rgba(0,0,0,0.5); /* optional dark overlay */
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.2); /* transparent card */
      border: none;
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div class="overlay">
    <nav class="navbar navbar-expand-lg bg-light shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="index.html">Admission Portal</a>
        <a class="btn btn-outline-primary" href="about.html">About</a>
      </div>
    </nav>

    <div class="container my-5" style="margin-top:2rem;">
      <h1 class="text-primary mb-4">Contact Us</h1>
      <p class="lead">Have questions? Fill out the form below or reach us at <strong>admissions@college.edu</strong>.</p>
      
      <div class="card p-4 shadow-sm">
        <form>
          <div class="mb-3">
            <label class="form-label">Your Name</label>
            <input type="text" class="form-control" placeholder="Enter your name">
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="Enter your email">
          </div>
          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea class="form-control" rows="4" placeholder="Write your message"></textarea>
          </div>
          <button type="submit" class="btn btn-primary w-100">Send Message</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
